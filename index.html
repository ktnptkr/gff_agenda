<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>GFF 2026 | Global Fintech Fest</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
	<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { navy: '#0F172A', brand: '#2563EB', surface: '#F8FAFC' }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-surface text-slate-800 antialiased pb-24">

<!-- Floating Chat Trigger Button -->
<button onclick="toggleChatDrawer()" class="fixed bottom-6 right-6 z-50 bg-brand text-white p-4 rounded-full shadow-2xl flex items-center gap-2 hover:bg-blue-600 transition">
    💬 <span class="text-xs font-bold hidden md:inline">Attendee Chat</span>
</button>

<!-- Chat Drawer (Fully Responsive Mobile Layout with Tagging Support) -->
<div id="chat-drawer" class="fixed bottom-0 right-0 md:right-6 w-full md:w-96 h-[75vh] md:h-[500px] max-h-[85vh] bg-white rounded-t-3xl md:rounded-2xl shadow-2xl z-50 transform translate-y-full transition-transform duration-300 flex flex-col border border-slate-200">
    <div class="p-4 bg-navy text-white rounded-t-3xl md:rounded-t-2xl flex justify-between items-center flex-shrink-0">
        <h3 class="font-bold text-sm">GFF 2026 Live Networking</h3>
        <button onclick="toggleChatDrawer()" class="text-slate-300 hover:text-white p-1">✕</button>
    </div>

    <!-- Step 1: Validation / Registration Gate -->
    <div id="chat-gate" class="flex-1 p-6 flex flex-col justify-center gap-3 bg-white overflow-y-auto">
        <h4 class="font-bold text-navy text-base mb-1">Welcome to GFF Networking</h4>
        <p class="text-xs text-slate-500 mb-2">Please introduce yourself before joining the attendee chat.</p>
        
        <input type="text" id="val-name" placeholder="Full Name *" class="bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-xs focus:outline-none focus:ring-1 focus:ring-brand">
        <input type="text" id="val-org" placeholder="Organization Name *" class="bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-xs focus:outline-none focus:ring-1 focus:ring-brand">
        <input type="email" id="val-email" placeholder="Work Email (Mandatory) *" class="bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-xs focus:outline-none focus:ring-1 focus:ring-brand">
        <input type="tel" id="val-mobile" placeholder="Mobile Number (Optional)" class="bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-xs focus:outline-none focus:ring-1 focus:ring-brand">
        <input type="text" id="val-desig" placeholder="Designation *" class="bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-xs focus:outline-none focus:ring-1 focus:ring-brand">
        
        <div class="flex items-center gap-2 text-xs text-slate-700 mt-1">
            <span>Attending GFF 2026? *</span>
            <label class="flex items-center gap-1 font-semibold"><input type="radio" name="val-attending" value="Yes" checked> Yes</label>
            <label class="flex items-center gap-1 font-semibold"><input type="radio" name="val-attending" value="No"> No</label>
        </div>

        <button onclick="submitChatValidation()" class="mt-2 bg-brand text-white py-2.5 rounded-lg text-xs font-bold hover:bg-blue-600 transition">Continue to Chat ➔</button>
    </div>

    <!-- Step 2: Active Chat Area -->
    <div id="chat-main-area" class="hidden flex-1 flex flex-col h-full overflow-hidden relative">
        <div id="chat-messages" class="flex-1 p-4 overflow-y-auto flex flex-col gap-3 bg-slate-50 text-sm"></div>
        
        <!-- Autocomplete Dropdown for @ Session Tagging -->
        <div id="chat-mention-dropdown" class="hidden absolute bottom-14 left-3 right-3 max-h-44 bg-white border border-slate-200 rounded-xl shadow-xl overflow-y-auto z-20 text-xs"></div>

        <div class="p-3 bg-white border-t border-slate-200 flex gap-2 flex-shrink-0 relative">
            <input type="text" id="chat-msg-input" placeholder="Type a message or use '@' to tag a session..." class="flex-1 bg-slate-100 border border-slate-200 rounded-lg px-3 py-2 text-xs focus:outline-none" oninput="handleChatInput(event)" onkeypress="handleChatKeyPress(event)">
            <button onclick="sendChatMessage()" class="bg-brand text-white px-4 py-2 rounded-lg text-xs font-bold">Send</button>
        </div>
    </div>
</div>

    <!-- Global Header -->
    <header class="bg-navy pt-10 pb-6 px-4 shadow-md relative z-50">
        <div class="max-w-3xl mx-auto flex flex-col gap-4">
            <div class="flex justify-between items-end">
                <div>
                    <h1 class="text-2xl font-extrabold text-white tracking-tight">GFF Agenda</h1>
                    <p class="text-brand font-bold tracking-wider text-xs uppercase mt-1">Mumbai, India 2026</p>
                </div>
                
                <!-- View Toggle -->
                <div class="flex bg-white/10 rounded-lg p-1 backdrop-blur-sm overflow-x-auto hide-scrollbar">
                    <button id="tab-all" class="px-4 py-1.5 rounded-md text-sm font-semibold bg-white text-navy shadow transition whitespace-nowrap">All Sessions</button>
                    <button id="tab-saved" class="px-4 py-1.5 rounded-md text-sm font-semibold text-white hover:text-slate-200 transition whitespace-nowrap">My Agenda</button>
                    <button id="tab-live" class="px-4 py-1.5 rounded-md text-sm font-semibold text-white hover:text-red-300 transition whitespace-nowrap flex items-center gap-1.5">
                        <span class="w-2 h-2 rounded-full bg-red-500 animate-pulse"></span> Live Now
                    </button>
                </div>
            </div>

            <!-- Notification & Export Actions Bar for My Agenda -->
            <div id="agenda-actions" class="hidden flex flex-wrap gap-2 items-center justify-between bg-white/10 p-3 rounded-xl border border-white/10 text-xs text-white">
                <button id="enable-notif-btn" class="bg-brand hover:bg-blue-600 text-white px-3 py-1.5 rounded-lg font-semibold transition flex items-center gap-1.5">
                    🔔 Enable 10-Min Reminders
                </button>
                <div class="flex gap-2">
                    <button onclick="exportCalendar('google')" class="bg-white/20 hover:bg-white/30 px-3 py-1.5 rounded-lg font-semibold transition">
                        📅 Google Cal
                    </button>
                    <button onclick="exportCalendar('ics')" class="bg-white/20 hover:bg-white/30 px-3 py-1.5 rounded-lg font-semibold transition">
                        📥 Download .ICS
                    </button>
                    <button onclick="shareItinerary()" class="bg-white/20 hover:bg-white/30 px-3 py-1.5 rounded-lg font-semibold transition">
                        🔗 Share Itinerary
                    </button>
                </div>
            </div>

            <!-- Search Bar -->
            <div class="relative w-full mt-1">
                <svg class="absolute left-3 top-1/2 transform -translate-y-1/2 text-slate-400" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
                <input type="text" id="search-input" placeholder="Search sessions, speakers, or companies..." class="w-full bg-white/10 border border-white/20 rounded-lg pl-10 pr-4 py-2.5 text-sm text-white placeholder-slate-300 focus:outline-none focus:bg-white focus:text-navy focus:placeholder-slate-500 transition">
            </div>
        </div>
    </header>

    <!-- Sticky Filters -->
    <div class="sticky top-0 z-40 glass-nav border-b border-slate-200/60 shadow-sm px-4 py-3">
        <div class="max-w-3xl mx-auto flex flex-col gap-3">
            <div id="date-filters" class="flex gap-2 overflow-x-auto hide-scrollbar pb-1"></div>
            
            <div class="flex gap-2 overflow-x-auto hide-scrollbar pb-1 items-center">
                <div class="flex flex-col flex-shrink-0">
                    <select id="room-filter" class="bg-white border border-slate-200 text-sm font-medium text-slate-700 rounded-lg px-3 py-1.5 focus:ring-2 focus:ring-brand outline-none cursor-pointer max-w-[140px] truncate"><option value="all">All Rooms ▾</option></select>
                </div>
                <div class="flex flex-col flex-shrink-0">
                    <select id="track-filter" class="bg-white border border-slate-200 text-sm font-medium text-slate-700 rounded-lg px-3 py-1.5 focus:ring-2 focus:ring-brand outline-none cursor-pointer max-w-[140px] truncate"><option value="all">All Tracks ▾</option></select>
                </div>
                <div class="flex flex-col flex-shrink-0">
                    <select id="format-filter" class="bg-white border border-slate-200 text-sm font-medium text-slate-700 rounded-lg px-3 py-1.5 focus:ring-2 focus:ring-brand outline-none cursor-pointer max-w-[140px] truncate"><option value="all">All Formats ▾</option></select>
                </div>
                <div class="flex flex-col flex-shrink-0">
                    <select id="speaker-filter" class="bg-white border border-slate-200 text-sm font-medium text-slate-700 rounded-lg px-3 py-1.5 focus:ring-2 focus:ring-brand outline-none cursor-pointer max-w-[140px] truncate"><option value="all">All Speakers ▾</option></select>
                </div>
                <div class="flex flex-col flex-shrink-0">
                    <select id="company-filter" class="bg-white border border-slate-200 text-sm font-medium text-slate-700 rounded-lg px-3 py-1.5 focus:ring-2 focus:ring-brand outline-none cursor-pointer max-w-[140px] truncate"><option value="all">All Companies ▾</option></select>
                </div>
            </div>
        </div>
    </div>

    <!-- Timeline Feed -->
    <main class="max-w-3xl mx-auto px-4 mt-6">
        <div class="mb-4 flex justify-between items-center text-sm font-bold text-slate-500">
            <span id="current-date-header">All Dates</span>
            <span id="event-count">0 Sessions</span>
        </div>
        <div id="event-feed" class="flex flex-col gap-8 pb-10"></div>
    </main>

    <!-- Toast Notification -->
    <div id="toast" class="fixed top-4 left-1/2 transform -translate-x-1/2 bg-slate-800 text-white px-6 py-3 rounded-full shadow-2xl z-50 text-sm font-semibold transition-all duration-300 opacity-0 pointer-events-none flex items-center gap-2">
        <span id="toast-icon"></span> <span id="toast-msg"></span>
    </div>

    <!-- Drawer -->
    <div id="drawer-overlay" class="fixed inset-0 bg-navy/60 backdrop-blur-sm z-50 hidden opacity-0 transition-opacity duration-300 cursor-pointer"></div>
    <div id="drawer" class="fixed bottom-0 left-0 right-0 w-full max-w-3xl mx-auto z-50 glass-drawer rounded-t-3xl transform translate-y-full transition-transform duration-300 ease-out shadow-2xl flex flex-col max-h-[90vh]">
        <div class="p-4 border-b border-slate-200/50 flex justify-between items-center bg-white/80 rounded-t-3xl">
            <span class="text-xs font-bold uppercase tracking-wider text-brand" id="drawer-format"></span>
            <div class="flex items-center gap-2">
                <button id="drawer-share-btn" class="p-2 bg-slate-100 rounded-full text-slate-600 hover:bg-slate-200 text-xs font-semibold px-3 flex items-center gap-1">🔗 Share</button>
                <button id="close-drawer" class="p-2 bg-slate-100 rounded-full text-slate-600 hover:bg-slate-200"><svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path></svg></button>
            </div>
        </div>
        <div class="p-6 overflow-y-auto hide-scrollbar flex-1 bg-white/95" id="drawer-content"></div>
    </div>

    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
