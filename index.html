<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>GFF 2026 | Global Fintech Fest</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        navy: '#0A192F',
                        brand: '#2563EB',
                        surface: '#F8FAFC'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-surface text-slate-800 antialiased font-sans pb-10">

    <!-- Glassmorphism Header -->
    <header class="sticky top-0 z-40 glass border-b border-white/20">
        <div class="max-w-3xl mx-auto px-4 py-4 flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold text-navy tracking-tight">GFF Agenda</h1>
                <p class="text-xs font-medium text-slate-500 uppercase tracking-wider">Mumbai, India 2026</p>
            </div>
            <button id="search-toggle" class="p-2 bg-slate-100 rounded-full text-slate-600 hover:bg-slate-200 transition">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35M17 10a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            </button>
        </div>
        
        <!-- Search Bar (Hidden by default) -->
        <div id="search-bar" class="hidden px-4 pb-4 max-w-3xl mx-auto">
            <input type="text" id="search-input" placeholder="Search by event, speaker, company..." class="w-full bg-white border border-slate-200 rounded-lg px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand/50 transition shadow-sm">
        </div>

        <!-- Date Tabs -->
        <div class="max-w-3xl mx-auto px-4 flex gap-2 pb-3 overflow-x-auto hide-scrollbar" id="date-filters">
            <!-- Populated via JS -->
        </div>
    </header>

    <!-- Main Agenda Feed -->
    <main class="max-w-3xl mx-auto px-4 pt-6">
        
        <!-- Track & Format Filters (Horizontal Scroll) -->
        <div class="flex items-center gap-3 mb-6 overflow-x-auto hide-scrollbar pb-2">
            <span class="text-xs font-bold text-slate-400 uppercase tracking-widest flex-shrink-0">Filters:</span>
            <select id="track-filter" class="bg-white border border-slate-200 text-sm font-medium text-slate-700 rounded-full px-4 py-1.5 shadow-sm focus:outline-none focus:ring-2 focus:ring-brand/50 flex-shrink-0 appearance-none cursor-pointer">
                <option value="all">All Tracks</option>
            </select>
            <select id="format-filter" class="bg-white border border-slate-200 text-sm font-medium text-slate-700 rounded-full px-4 py-1.5 shadow-sm focus:outline-none focus:ring-2 focus:ring-brand/50 flex-shrink-0 appearance-none cursor-pointer">
                <option value="all">All Formats</option>
            </select>
        </div>

        <div id="event-feed" class="flex flex-col gap-4">
            <!-- Event Cards go here -->
        </div>
    </main>

    <!-- Bottom Drawer (Glassmorphism Modal) -->
    <div id="drawer-overlay" class="fixed inset-0 bg-navy/40 backdrop-blur-sm z-50 hidden opacity-0 transition-opacity duration-300"></div>
    
    <div id="drawer" class="fixed bottom-0 left-0 right-0 w-full max-w-3xl mx-auto z-50 glass-drawer rounded-t-3xl transform translate-y-full transition-transform duration-300 ease-out shadow-2xl flex flex-col max-h-[85vh]">
        <div class="p-5 border-b border-slate-200/50 flex justify-between items-center bg-white/50 rounded-t-3xl flex-shrink-0">
            <span class="text-xs font-bold uppercase tracking-wider text-brand" id="drawer-format">Format</span>
            <button id="close-drawer" class="p-2 bg-slate-200/50 rounded-full text-slate-600 hover:bg-slate-300 transition">
                <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>
        <div class="p-6 overflow-y-auto hide-scrollbar flex-1 bg-white/80">
            <h2 id="drawer-title" class="text-xl font-bold text-navy leading-tight mb-3">Event Title</h2>
            <div class="flex items-center gap-4 text-sm text-slate-600 mb-6 font-medium">
                <span class="flex items-center gap-1"><svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg> <span id="drawer-time">10:00 - 10:45</span></span>
                <span class="flex items-center gap-1"><svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg> <span id="drawer-room">Hall Name</span></span>
            </div>
            
            <div class="mb-6">
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-2">About this Session</h3>
                <p id="drawer-desc" class="text-sm text-slate-700 leading-relaxed">Description goes here...</p>
            </div>

            <div class="mb-6">
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-2">Speakers & Participants</h3>
                <div id="drawer-speakers" class="text-sm font-semibold text-slate-800 leading-relaxed whitespace-pre-line">
                    Speaker names...
                </div>
            </div>

            <div class="mb-6">
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-2">Companies Represented</h3>
                <p id="drawer-companies" class="text-sm text-slate-600 leading-relaxed">Company names...</p>
            </div>
            
            <div class="pt-4 border-t border-slate-200/50">
                <span id="drawer-track" class="inline-block px-3 py-1 bg-slate-100 text-slate-600 text-xs font-semibold rounded-md">Track Name</span>
            </div>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
