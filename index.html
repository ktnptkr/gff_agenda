<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>GFF 2026 | Global Fintech Fest</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        navy: '#0F172A',
                        brand: '#4F46E5',
                        surface: '#F8FAFC'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-surface text-slate-800 antialiased pb-20">

    <!-- Hero Header -->
    <header class="bg-navy pt-12 pb-16 px-4 rounded-b-[2.5rem] shadow-xl relative overflow-hidden">
        <div class="absolute top-0 left-0 w-full h-full bg-gradient-to-br from-brand/20 to-transparent"></div>
        <div class="max-w-3xl mx-auto relative z-10 flex justify-between items-end">
            <div>
                <p class="text-brand font-bold tracking-wider text-xs mb-1 uppercase">Mumbai, India</p>
                <h1 class="text-3xl font-extrabold text-white tracking-tight">GFF Agenda <span class="text-slate-400 font-normal">2026</span></h1>
            </div>
            <button id="search-toggle" class="bg-white/10 hover:bg-white/20 p-2.5 rounded-full text-white backdrop-blur-sm transition">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35M17 10a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            </button>
        </div>
    </header>

    <!-- Search Bar (Hidden by default) -->
    <div id="search-bar" class="hidden px-4 pt-4 max-w-3xl mx-auto -mb-2 relative z-50">
        <input type="text" id="search-input" placeholder="Search by event, speaker, company..." class="w-full bg-white border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-brand/50 transition shadow-lg">
    </div>

    <!-- Sticky Glassmorphic Filter Bar -->
    <div class="sticky top-0 z-40 glass-nav border-b border-slate-200/60 shadow-sm mt-6 mx-4 max-w-3xl md:mx-auto rounded-2xl px-4 py-3 flex gap-2 overflow-x-auto hide-scrollbar">
        <div id="date-filters" class="flex gap-2 flex-shrink-0">
            <!-- Date buttons populated by JS -->
        </div>
        <div class="w-px h-6 bg-slate-300 my-auto mx-2 flex-shrink-0"></div>
        <select id="track-filter" class="bg-white border border-slate-200 text-sm font-medium text-slate-700 rounded-full px-4 py-2 focus:ring-2 focus:ring-brand/50 flex-shrink-0 appearance-none outline-none cursor-pointer max-w-[150px] truncate">
            <option value="all">All Tracks ▾</option>
        </select>
        <select id="format-filter" class="bg-white border border-slate-200 text-sm font-medium text-slate-700 rounded-full px-4 py-2 focus:ring-2 focus:ring-brand/50 flex-shrink-0 appearance-none outline-none cursor-pointer max-w-[150px] truncate">
            <option value="all">All Formats ▾</option>
        </select>
    </div>

    <!-- Timeline Feed -->
    <main class="max-w-3xl mx-auto px-4 mt-8">
        <div class="relative border-l-2 border-slate-200 ml-3 md:ml-4 space-y-8 pb-10" id="event-feed">
            <!-- Events populated by JS -->
        </div>
    </main>

    <!-- Bottom Drawer (Glassmorphism Modal) -->
    <div id="drawer-overlay" class="fixed inset-0 bg-navy/40 backdrop-blur-sm z-50 hidden opacity-0 transition-opacity duration-300 cursor-pointer"></div>
    
    <div id="drawer" class="fixed bottom-0 left-0 right-0 w-full max-w-3xl mx-auto z-50 glass-drawer rounded-t-3xl transform translate-y-full transition-transform duration-300 ease-out shadow-2xl flex flex-col max-h-[85vh]">
        <div class="p-5 border-b border-slate-200/50 flex justify-between items-center bg-white/50 rounded-t-3xl flex-shrink-0">
            <span class="text-xs font-bold uppercase tracking-wider text-brand" id="drawer-format">Format</span>
            <button id="close-drawer" class="p-2 bg-slate-200/50 rounded-full text-slate-600 hover:bg-slate-300 transition">
                <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>
        <div class="p-6 overflow-y-auto hide-scrollbar flex-1 bg-white/80">
            <h2 id="drawer-title" class="text-xl font-bold text-navy leading-tight mb-3">Event Title</h2>
            <div class="flex flex-wrap items-center gap-4 text-sm text-slate-600 mb-6 font-medium">
                <span class="flex items-center gap-1">🕒 <span id="drawer-time">10:00 - 10:45</span></span>
                <span class="flex items-center gap-1">📍 <span id="drawer-room">Hall Name</span></span>
            </div>
            
            <div class="mb-6">
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-2">About this Session</h3>
                <p id="drawer-desc" class="text-sm text-slate-700 leading-relaxed">Description goes here...</p>
            </div>

            <div class="mb-6">
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-2">Speakers & Participants</h3>
                <div id="drawer-speakers" class="text-sm font-semibold text-slate-800 leading-relaxed whitespace-pre-line">
                    Speaker names...
                </div>
            </div>

            <div class="mb-6">
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-2">Companies Represented</h3>
                <p id="drawer-companies" class="text-sm text-slate-600 leading-relaxed">Company names...</p>
            </div>
            
            <div class="pt-4 border-t border-slate-200/50 flex flex-wrap gap-2" id="drawer-track">
                <!-- Track tags injected here -->
            </div>
        </div>
    </div>

    <!-- Ensure data.js is loaded first -->
    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
