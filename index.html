<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>GFF 2026 Agenda</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="style.css">
</head>
<body data-theme="light">
    
    <!-- Header Board -->
    <header class="board">
        <div class="board-in">
            <div class="board-top">
                <div class="wordmark">Global Fintech Fest <span>2026</span></div>
                <div class="board-sub" id="banner">Mumbai · 9–11 Sep · all times IST</div>
            </div>
            
            <!-- Mobile Filters (Simplified for this draft) -->
            <div class="board-ctl">
                <div class="days" id="days" role="group">
                    <button class="daybtn" aria-pressed="true">
                        <span class="dnum">09</span> Sept
                    </button>
                    <button class="daybtn">
                        <span class="dnum">10</span> Sept
                    </button>
                    <button class="daybtn">
                        <span class="dnum">11</span> Sept
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="shell">
        <section id="stage">
            <div class="daybar">
                <h3>Agenda Schedule</h3>
            </div>
            <div class="slotrows" id="agenda-container">
                <!-- Events will be injected here dynamically -->
            </div>
        </section>
    </main>

    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
